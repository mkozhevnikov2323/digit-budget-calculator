name: Pull request CI

on:
  pull_request:
    branches: [main, 'feat/coherent-classification-history-client', 'feat/persistent-historical-classification', 'feat/real-classification-statistics', 'feat/real-expense-forecasting']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and critical regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Explicit mocked regression suites keep CI independent of backend services.
      # Assess the full suite separately before adding it to this job.
      - name: Critical financial and modal regressions
        run: >-
          npm test -- --ci --runInBand --runTestsByPath
          src/shared/api/tests/financialMutationApis.test.ts
          src/shared/api/tests/sessionBoundary.test.tsx
          src/shared/api/tests/crossTabSession.test.tsx
          src/entities/User/model/tests/verifiedOwner.test.tsx
          src/features/AddExpense/ui/tests/AddExpenseForm.test.tsx
          src/features/AddIncome/ui/tests/AddIncomeForm.test.tsx
          src/features/EditExpense/ui/tests/EditExpenseForm.test.tsx
          src/features/EditIncome/ui/tests/EditIncomeForm.test.tsx
          src/pages/IncomePage/ui/tests/IncomePage.test.tsx
          src/pages/BalancePage/ui/tests/BalancePage.test.tsx
          src/shared/ui/Modal/tests/Modal.test.tsx
          src/widgets/Modals/AddExpenseModal/ui/tests/AddExpenseModal.test.tsx
          src/widgets/Modals/AddIncomeModal/ui/tests/AddIncomeModal.test.tsx
          src/features/FinancialAnalytics/model/tests/money.test.ts
          src/features/FinancialAnalytics/model/tests/period.test.ts
          src/features/FinancialAnalytics/model/tests/apiRange.test.ts
          src/features/FinancialAnalytics/model/tests/validation.test.ts
          src/features/FinancialAnalytics/model/tests/calculations.test.ts
          src/features/FinancialAnalytics/model/tests/annualHistory.test.ts
          src/features/HistoricalClassification/model/tests/contract.test.ts
          src/features/HistoricalClassification/model/tests/historyApi.test.ts
          src/features/HistoricalClassification/model/tests/coherentHistory.test.ts
          src/features/HistoricalClassification/model/tests/manualClient.test.ts
          src/features/HistoricalClassification/ui/tests/PersistentReview.test.tsx
          src/features/HistoricalClassification/ui/tests/HistoricalClassification.test.tsx
          src/features/ClassificationStatistics/model/tests/statistics.test.ts
          src/features/ClassificationStatistics/model/tests/recordedHistory.test.ts
          src/features/ClassificationStatistics/ui/tests/RealClassificationStatistics.test.tsx
          src/features/ClassificationStatistics/ui/tests/ClassificationStatistics.test.tsx
          src/features/ExpenseForecast/model/tests/forecast.test.ts
          src/features/ExpenseForecast/model/tests/recordingEvidence.test.ts
          src/features/ExpenseForecast/ui/tests/RealExpenseForecast.test.tsx
          src/features/ExpenseForecast/ui/tests/ExpenseForecast.test.tsx
          src/features/BudgetPlanning/model/tests/plan.test.ts
          src/features/BudgetPlanning/model/tests/recordedPlan.test.ts
          src/features/BudgetPlanning/ui/tests/RecordedBudgetPlanning.test.tsx
          src/features/BudgetPlanning/ui/tests/RecordedPlanActual.test.tsx
          src/features/BudgetPlanning/ui/tests/BudgetPlanning.test.tsx
          src/features/FinancialAnalytics/model/tests/useFinancialAnalytics.test.tsx
          src/pages/AnalyticsPage/ui/tests/AnalyticsPage.test.tsx
          src/pages/AnalyticsPage/ui/tests/AnalyticsRoute.test.tsx
          src/pages/AnalyticsPage/ui/tests/AnalyticsResults.test.tsx
          src/features/RecurrenceAnalytics/model/tests/window.test.ts
          src/features/RecurrenceAnalytics/model/tests/validation.test.ts
          src/features/RecurrenceAnalytics/ui/tests/RecurrenceSection.test.tsx
          src/features/FinancialClassification/model/tests/classification.test.ts
          src/features/FinancialClassification/model/tests/snapshotAdapter.test.ts
          src/features/FinancialClassification/model/tests/useOwnerClassificationData.test.tsx
          src/features/FinancialClassification/model/tests/reviewSession.test.ts
          src/features/FinancialClassification/model/tests/useOwnerClassificationReview.test.tsx
          src/pages/ClassificationPreviewPage/ui/tests/ClassificationPreviewPage.test.tsx
          src/pages/ClassificationPreviewPage/ui/tests/ClassificationPreviewRoute.test.tsx
          src/features/FinancialClassification/ui/tests/ClassificationPreview.test.tsx
          src/features/FinancialClassification/ui/tests/ClassificationReviewPrototype.test.tsx

  browser-e2e:
    name: Real full-stack Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7.0.45@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --tmpfs /data/db:rw,noexec,nosuid,size=512m
          --tmpfs /data/configdb:rw,noexec,nosuid,size=64m
          --log-driver none
          --health-cmd "mongosh --quiet --norc --eval 'quit(db.runCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: frontend
          persist-credentials: false

      - name: Read immutable public backend revision
        id: backend
        working-directory: frontend
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const m = JSON.parse(fs.readFileSync("e2e/backend-revision.json", "utf8"));
            if (m.repository !== "mkozhevnikov2323/digit-budget-calculator-api" || !/^[a-f0-9]{40}$/.test(m.commit)) throw Error("Invalid pinned backend manifest");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${m.commit}\n`);
          '

      - name: Checkout pinned public backend (no additional credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mkozhevnikov2323/digit-budget-calculator-api
          ref: ${{ steps.backend.outputs.sha }}
          path: backend
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install locked backend dependencies and build real app
        working-directory: backend
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.backend.outputs.sha }}"
          npm ci
          npm run typecheck
          npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all required real browser scenarios
        env:
          BUDGET_E2E_BACKEND: ${{ github.workspace }}/backend
          MONGODB_INTEGRATION_TEST: '1'
          MONGODB_TEST_BASE_URI: mongodb://127.0.0.1:27017
          TZ: UTC
        run: npm run test:e2e

      - name: Enforce complete first-attempt browser results
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const s = JSON.parse(fs.readFileSync("e2e-results/summary.json", "utf8"));
            if (!s.complete || s.expected !== 14 || s.executed !== 14 || s.passed !== 14 || s.tests.some(t => !t.pass || !t.cleanupVerified || t.status !== "passed")) throw Error("Incomplete required browser run");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, fs.readFileSync("e2e-results/summary.md", "utf8"));
          '

      - name: Upload sanitized JUnit and browser summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-results
          path: frontend/e2e-results/
          if-no-files-found: error
          retention-days: 5
