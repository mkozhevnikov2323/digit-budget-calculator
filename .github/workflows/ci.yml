name: Pull request CI

on:
  pull_request:
    branches: [main, 'feat/coherent-classification-history-client', 'feat/persistent-historical-classification', 'feat/real-classification-statistics', 'feat/real-expense-forecasting', 'test/classification-runtime-browser-integration']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and critical regressions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # P12 measures the full suite locally and runs every existing regression.
      # No retries, exclusions or increased Jest per-test deadlines.
      - name: Full financial modal session and integrity regressions
        run: npm test -- --ci --runInBand

  browser-e2e:
    name: Real full-stack Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7.0.45@sha256:c53852c00c23ca9f23fc39690350ffa9a80e3642fe8f96879726d8da0abe80a7
        ports:
          - 127.0.0.1:27017:27017
        options: >-
          --tmpfs /data/db:rw,noexec,nosuid,size=512m
          --tmpfs /data/configdb:rw,noexec,nosuid,size=64m
          --log-driver none
          --health-cmd "mongosh --quiet --norc --eval 'quit(db.runCommand({ ping: 1 }).ok === 1 ? 0 : 1)'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 10s
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout frontend
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: frontend
          persist-credentials: false

      - name: Read immutable public backend revision
        id: backend
        working-directory: frontend
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const m = JSON.parse(fs.readFileSync("e2e/backend-revision.json", "utf8"));
            if (m.repository !== "mkozhevnikov2323/digit-budget-calculator-api" || !/^[a-f0-9]{40}$/.test(m.commit)) throw Error("Invalid pinned backend manifest");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `sha=${m.commit}\n`);
          '

      - name: Checkout pinned public backend (no additional credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: mkozhevnikov2323/digit-budget-calculator-api
          ref: ${{ steps.backend.outputs.sha }}
          path: backend
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Install locked backend dependencies and build real app
        working-directory: backend
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.backend.outputs.sha }}"
          npm ci
          npm run typecheck
          npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all required real browser scenarios
        env:
          BUDGET_E2E_BACKEND: ${{ github.workspace }}/backend
          BUDGET_BROWSER_LOCAL_PROVIDER: '1'
          MONGODB_INTEGRATION_TEST: '1'
          MONGODB_TEST_BASE_URI: mongodb://127.0.0.1:27017
          TZ: UTC
        run: npm run test:e2e

      - name: Enforce complete first-attempt browser results
        if: ${{ !cancelled() }}
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const s = JSON.parse(fs.readFileSync("e2e-results/summary.json", "utf8"));
            if (!s.complete || s.expected !== 14 || s.executed !== 14 || s.passed !== 14 || s.tests.some(t => !t.pass || !t.cleanupVerified || t.status !== "passed")) throw Error("Incomplete required browser run");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, fs.readFileSync("e2e-results/summary.md", "utf8"));
          '

      - name: Real browser mutation and late-response integrity scenarios
        env:
          BUDGET_E2E_BACKEND: ${{ github.workspace }}/backend
          BUDGET_BROWSER_LOCAL_PROVIDER: '1'
          MONGODB_INTEGRATION_TEST: '1'
          MONGODB_TEST_BASE_URI: mongodb://127.0.0.1:27017
          TZ: UTC
        run: npm run test:e2e:p12

      - name: Deterministic history request and query budgets (S/M)
        env:
          MONGODB_INTEGRATION_TEST: '1'
          MONGODB_TEST_BASE_URI: mongodb://127.0.0.1:27017
          TZ: UTC
        run: npm run bench:p12 -- --backend ../backend --sizes 100,1000 --repetitions 1

      - name: Upload sanitized P12 integrity and smoke metrics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p12-smoke-results
          path: |
            frontend/p12-e2e-results/
            frontend/benchmark-results/
          if-no-files-found: error
          retention-days: 5

      - name: Upload sanitized JUnit and browser summary
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-e2e-results
          path: frontend/e2e-results/
          if-no-files-found: error
          retention-days: 5
